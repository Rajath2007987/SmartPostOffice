services:
  - type: web
    name: SmartPostOffice
    env: python
    region: oregon
    branch: main
    buildCommand: "python -m pip install -U pip setuptools wheel && python -m pip install -r requirements.txt"
    startCommand: "python -m pip install -U setuptools wheel && gunicorn wsgi:app"
    autoDeploy: true
    healthCheckPath: "/"
