<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - Smart Post Office</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .analytics-container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      max-width: 1200px;
      width: 100%;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-card h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      opacity: 0.9;
    }
    .stat-card .value {
      font-size: 36px;
      font-weight: bold;
    }
    .chart-container {
      position: relative;
      height: 400px;
      margin-top: 30px;
    }
    .back-btn {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="analytics-container">
    <a href="/admin_dashboard" class="back-btn">← Back to Dashboard</a>
    <h1>📈 Analytics & Reports</h1>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Parcels</h3>
        <div class="value">{{ total }}</div>
      </div>
      <div class="stat-card">
        <h3>In Transit</h3>
        <div class="value">{{ in_transit }}</div>
      </div>
      <div class="stat-card">
        <h3>Delivered</h3>
        <div class="value">{{ delivered }}</div>
      </div>
      <div class="stat-card">
        <h3>Total Revenue</h3>
        <div class="value">₹{{ total_revenue }}</div>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="dailyChart"></canvas>
    </div>

    <script>
    // @ts-nocheck
    const data = {
      labels: [{% for stat in daily_stats %}'{{ stat[0] }}'{% if not loop.last %},{% endif %}{% endfor %}],
      datasets: [{
        label: 'Parcels Processed',
        data: [{% for stat in daily_stats %}{{ stat[1] }}{% if not loop.last %},{% endif %}{% endfor %}],
        borderColor: '#667eea',
        backgroundColor: 'rgba(102, 126, 234, 0.1)',
        borderWidth: 2,
        fill: true,
        tension: 0.4
      }]
    };

    const ctx = document.getElementById('dailyChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: data,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: 'top' },
          title: { display: true, text: 'Daily Parcel Activity (Last 7 Days)' }
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
    </script>
  </div>
</body>
</html>
